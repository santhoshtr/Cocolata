[project]
name = "Cocolata"
version = "0.1.0"
description = "Cocolata Malayalam typeface by Santhosh Thottingal"
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]

dependencies = [
  "brotli>=1.1.0",
  "fontmake>=3.11.0",
  "munch>=4.0.0",
  "pyyaml>=6.0.3",
  "ufonormalizer>=0.6.2",
  "uharfbuzz",
  "skia-pathops>=0.8.0",
  "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
  "fontbakery>=1.0.0",
  "pyright>=1.1.401",
  "ruff>=0.11.7",
  "pycairo>=1.28.0",
]
