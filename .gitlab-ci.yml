image: "rust:1-trixie"

# System deps for the build pipeline:
#   texlive-metapost   -> mpost (glyph SVGs)
#   libharfbuzz-bin    -> hb-view (proofs)
#   opentype-sanitizer -> ots-sanitize (make test)
#   zip                -> release archives
# fontc and fontspector are installed as prebuilt binaries via cargo-binstall.
before_script:
  - apt-get update -y
  - apt-get install -y --no-install-recommends make git zip texlive-metapost libharfbuzz-bin opentype-sanitizer curl
  - export PATH="$CARGO_HOME/bin:$PATH"
  - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
  - cargo-binstall -y --locked fontc
  # fontspector release tags (fontspector-vX.Y.Z) do not match the default
  # binstall URL pattern, so give the URL of the prebuilt binary.
  - >-
    cargo-binstall -y --locked
    --pkg-url '{ repo }/releases/download/fontspector-v{ version }/fontspector-{ version }-{ target }.tar.gz'
    --pkg-fmt tgz --bin-dir 'fontspector-{ version }-{ target }/{ bin }{ binary-ext }'
    fontspector

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - .cargo/
    - target/

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  PACKAGE_VERSION: $CI_COMMIT_TAG
  COCOLATA_VAR_TTF: "Cocolata-variable.ttf"
  COCOLATA_VAR_WOFF2: "Cocolata-variable.woff2"
  COCOLATA_ZIP: "Cocolata-${PACKAGE_VERSION}.zip"
  COCOLATA_TAR_BALL: "Cocolata-${PACKAGE_VERSION}.tar.gz"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/fontrelease/${PACKAGE_VERSION}"

stages:
  - build
  - test
  - deploy
  - release

build:
  stage: build
  script:
    - make -j$(nproc) build release
  artifacts:
    paths:
      - fonts

test:
  stage: test
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --check
    - cargo clippy --release -- -D warnings
    - cargo test --release
    - make -j$(nproc) build test
  artifacts:
    expire_in: 1000 yrs
    paths:
      - proofs
      - tests

pages:
  stage: deploy
  before_script:
    - echo "Pass. Just overriding"
  script:
    - mkdir public
    - cp -rf fonts tests specimen proofs public
  artifacts:
    expire_in: 1000 yrs
    paths:
      - public  # instruct GitLab to keep the public folder
  only:
    - master

upload:
  stage: release
  image: curlimages/curl:latest
  dependencies:
    - build
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "Pass. Just overriding"
  script:
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file fonts/${COCOLATA_VAR_TTF} ${PACKAGE_REGISTRY_URL}/${COCOLATA_VAR_TTF}
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file fonts/${COCOLATA_VAR_WOFF2} ${PACKAGE_REGISTRY_URL}/${COCOLATA_VAR_WOFF2}
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file fonts/${COCOLATA_ZIP} ${PACKAGE_REGISTRY_URL}/${COCOLATA_ZIP}
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file fonts/${COCOLATA_TAR_BALL} ${PACKAGE_REGISTRY_URL}/${COCOLATA_TAR_BALL}

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["upload"]
  only:
    - tags
  before_script:
    - echo "Pass. Just overriding"
  script:
    - echo "Running release_job for $CI_COMMIT_TAG of $CI_PROJECT_NAME"
  release:
    name: 'Release $CI_COMMIT_TAG of $CI_PROJECT_NAME'
    description: 'Release $CI_COMMIT_TAG' # Need to replace with 'CHANGELOG.md'
    # tag_name is a mandatory field and can not be an empty string
    tag_name: '$CI_COMMIT_TAG'
    ref: $CI_COMMIT_TAG
    assets:
      links:
        - name: 'Cocolata Variable font TTF version - Recommended for desktop installations'
          url: '${PACKAGE_REGISTRY_URL}/${COCOLATA_VAR_TTF}'
        - name: 'Cocolata Variable font webfont - For font embedding in webpages.'
          url: '${PACKAGE_REGISTRY_URL}/${COCOLATA_VAR_WOFF2}'
        - name: 'Cocolata fonts as tar.gz'
          url: '${PACKAGE_REGISTRY_URL}/${COCOLATA_TAR_BALL}'
        - name: 'Cocolata fonts as zip file'
          url: '${PACKAGE_REGISTRY_URL}/${COCOLATA_ZIP}'

trigger_job:
  stage: release
  needs: ["release"]
  only:
    - tags
  trigger:
    project: smc/smc.org.in
