[package]
name = "Cocolata"
version = "0.1.0"
edition = "2024"
rust-version ="1.96.0"

[dependencies]
norad = "0.18.0"
svg2glif = "0.3.2"
fontdrasil = "1.0.0"
fontations = "0.3.0"
ttf2woff2 = { version = "0.13", default-features = false }
sha1 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4.4", features = ["derive"] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
lazy_static = "1.4"
plist = "1.6"
chrono = "0.4"
unicode-normalization = "0.1"
minijinja = "2.0"
